name: Mirror Instagram videos to R2

on:
  # Weekly, Mondays at 06:00 UTC.
  schedule:
    - cron: '0 6 * * 1'
  # Manual trigger, with optional overrides of the repo variables.
  workflow_dispatch:
    inputs:
      username:
        description: 'Instagram username to scan'
        required: false
        default: ''
      hashtags:
        description: 'Comma-separated hashtags a post must all contain'
        required: false
        default: ''
      max_posts:
        description: 'Max recent posts to scan'
        required: false
        default: ''

concurrency:
  group: instagram-fetch
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install 'instaloader==4.13.*' 'boto3>=1.34'

      - name: Fetch, mirror to R2, write manifest
        env:
          # Instagram scan config (repo variables, overridable on manual runs).
          IG_USERNAME: ${{ inputs.username || vars.IG_USERNAME || 'prepfinland' }}
          IG_HASHTAGS: ${{ inputs.hashtags || vars.IG_HASHTAGS || 'prepfinland,beprepared,preparmy' }}
          IG_MAX:      ${{ inputs.max_posts || vars.IG_MAX || '60' }}
          # Cloudflare R2 bucket + content location (repo variables).
          R2_ACCOUNT_ID:      ${{ vars.R2_ACCOUNT_ID }}
          R2_BUCKET:          ${{ vars.R2_BUCKET }}
          R2_PREFIX:          ${{ vars.R2_PREFIX }}
          R2_PUBLIC_BASE_URL: ${{ vars.R2_PUBLIC_BASE_URL }}
          # R2 S3 credentials (repo secrets).
          R2_ACCESS_KEY_ID:     ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python .github/scripts/fetch_instagram.py

      - name: Commit manifest if changed
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          if [[ -n "$(git status --porcelain public/instagram.json)" ]]; then
            git add public/instagram.json
            git commit -m "chore: refresh instagram videos"
            git push
          else
            echo "No changes."
          fi
